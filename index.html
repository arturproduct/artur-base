<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#111214">
<title>Artur product — база товаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#111214; --surface:#1a1b1f; --surface-2:#232529; --line:rgba(255,255,255,.08);
  --text:#ffffff; --muted:#96989f; --dim:#6b6e78;
  --accent:#f0482c; --on-accent:#141414; --accent-soft:rgba(240,72,44,.14);
  --go:#3dd68c; --check:#f5b942; --wait:#8f93a0;
  --r-lg:22px; --r:14px; --r-sm:10px;
  --tab-h:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:700px){body{background:#0a0a0b}#app{min-height:100vh;box-shadow:0 0 0 1px var(--line)}}

/* ---------- view ---------- */
#view{padding:calc(14px + env(safe-area-inset-top)) 18px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.active{display:block}

/* header */
.head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.head .txt{flex:1;min-width:0}
.head h1{font-size:23px;font-weight:900;line-height:1.15;margin:0 0 4px;letter-spacing:-.2px}
.head p{margin:0;color:var(--muted);font-size:12.5px;font-weight:500}
.ava{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--surface-2)}
.ava img{width:100%;height:100%;object-fit:cover}

/* accent card */
.focus{background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:26px;position:relative;overflow:hidden}
.focus .eyebrow{font-size:12px;font-weight:700;opacity:.75;margin-bottom:8px}
.focus h2{font-size:19px;font-weight:900;line-height:1.2;margin:0 0 12px;letter-spacing:-.2px}
.focus .steps{display:flex;gap:6px;margin-bottom:8px}
.focus .steps i{flex:1;height:6px;border-radius:3px;background:rgba(20,20,20,.22)}
.focus .steps i.done{background:#141414}
.focus .stepnames{display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:.8;margin-bottom:14px}
.focus p{margin:0 0 16px;font-size:13px;font-weight:500;line-height:1.45;opacity:.92}
.focus .btn{background:#141414;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.focus .btn svg{width:16px;height:16px}

/* section titles */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.sec h3{font-size:15px;font-weight:700;margin:0}
.sec button,.sec a{font-size:12.5px;font-weight:600;color:var(--muted)}

/* quick tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:96px}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.tile span{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:3px}

/* product rows */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .ph{width:66px;height:66px;border-radius:12px;overflow:hidden;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--dim)}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .bd{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14px;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{font-size:12.5px;font-weight:600;margin-bottom:5px}
.row .vd{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
.dot.go{background:var(--go)}.dot.check{background:var(--check)}
.row .chev{color:var(--dim);flex:none}

/* search + chips */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-weight:500;font-size:14px;outline:none;min-width:0}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.chip.x{background:var(--accent-soft);color:var(--accent)}
.count{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:6px}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:500;font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

/* about */
.about .logo{width:84px;height:84px;border-radius:22px;overflow:hidden;margin:6px 0 16px}
.about .logo img{width:100%;height:100%;object-fit:cover}
.about h1{font-size:22px;font-weight:900;margin:0 0 8px}
.about p{color:var(--muted);font-weight:500;margin:0 0 18px;font-size:13.5px}
.kv{border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:500}
.kv div span:first-child{color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.lnk{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:13px 14px;font-weight:600;font-size:13.5px;text-align:left;width:100%}
.lnk .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.lnk .ic svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnk .chev{margin-left:auto;color:var(--dim)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar .in{pointer-events:auto;width:100%;max-width:430px;background:rgba(17,18,20,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--dim);font-size:10.5px;font-weight:700;border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab:focus-visible,.tile:focus-visible,.row:focus-visible,.lnk:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:30;display:none;justify-content:center;align-items:flex-end;background:rgba(0,0,0,.55)}
.sheet.open{display:flex}
.panel{width:100%;max-width:430px;max-height:100%;background:var(--bg);border-radius:22px 22px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--surface-2);margin:10px auto 0}
.hero{position:relative;margin:12px 18px 0;border-radius:18px;overflow:hidden;background:var(--surface);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:var(--dim)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,18,20,.7);display:flex;align-items:center;justify-content:center;color:#fff}
.hero .close svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .star{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,18,20,.7);display:flex;align-items:center;justify-content:center}
.hero .star svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round}
.hero .star.on svg{fill:var(--accent);stroke:var(--accent)}
.pb{padding:16px 18px calc(24px + env(safe-area-inset-bottom))}
.pb h2{font-size:20px;font-weight:900;line-height:1.2;margin:0 0 10px;letter-spacing:-.2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:8px;padding:5px 9px}
.verdict{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-weight:600;font-size:13px;line-height:1.4}
.verdict .dot{margin-top:6px}
.blk{margin-bottom:16px}
.blk h4{margin:0 0 5px;font-size:12px;font-weight:700;color:var(--muted)}
.blk p{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.blk .big{font-size:14px;font-weight:600;line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fact{background:var(--surface);border-radius:12px;padding:11px 12px}
.fact span{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-bottom:3px}
.fact b{font-size:13px;font-weight:700;line-height:1.3}
.risk{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:20px}
.risk h4{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.risk p{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:13px 16px;font-weight:700;font-size:13.5px;background:var(--surface)}
.act.primary{background:var(--accent);color:var(--on-accent)}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.ghost{background:none;color:var(--muted);padding:8px}

@media (prefers-reduced-motion:reduce){.panel{transition:none}}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 42%,#f35434 0%,#e43a21 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .mark{width:min(64vw,260px);animation:mark .7s cubic-bezier(.2,.8,.2,1) both}
#splash .mark img{width:100%;display:block}
#splash .sub{margin-top:6px;font-weight:700;font-size:13px;color:#141414;opacity:0;animation:fade .6s .35s forwards}
#splash .bar{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom));width:120px;height:3px;border-radius:2px;background:rgba(20,20,20,.16);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:#141414;border-radius:2px;transform-origin:left;animation:load 3.4s .25s cubic-bezier(.4,0,.2,1) both}
@keyframes mark{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:.8}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash .mark,#splash .bar i{animation:none}#splash .sub{animation:none;opacity:.8}}
</style>
</head>

    <div class="tiles">${QUICK.map(q => { const n = PRODUCTS.filter(q.test).length; return `<button class="tile" data-quick="${q.id}"><div class="ic">${ICONS[q.icon]}</div><div><b>${q.label}</b><span>${n} ${plural(n,"товар","товара","товаров")}</span></div></button>`; }).join("")}</div>
    <div class="sec"><h3>Последние находки</h3><button data-tab="base">Вся база</button></div>
    ${listHTML(latest.slice(0,4))}`;
}

function renderBase() {
  const cats = ["Все", ...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
  let items = PRODUCTS;
  if (category !== "Все") items = items.filter(p => p.category === category);
  const q = QUICK.find(x => x.id === filter); if (q) items = items.filter(q.test);
  if (query) { const s = query.toLowerCase(); items = items.filter(p => [p.name,p.category,p.source,p.why,p.demand,p.model].join(" ").toLowerCase().includes(s)); }
  document.getElementById("s-base").innerHTML = `
    <div class="head"><div class="txt"><h1>База товаров</h1><p>${PRODUCTS.length} ${plural(PRODUCTS.length,"находка","находки","находок")} с доказательствами спроса</p></div></div>
    <div class="search">${ICONS.link.replace("<svg",'<svg style="display:none"')}<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Название, категория, площадка" value="${esc(query)}"></div>
    <div class="chips">${q ? `<button class="chip x" data-clear="1">${esc(q.label)} ✕</button>` : ""}${cats.map(c => `<button class="chip ${c===category?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="count">${items.length} ${plural(items.length,"товар","товара","товаров")}</div>
    ${listHTML(items)}`;
  const inp = document.getElementById("q");
  inp.addEventListener("input", e => { query = e.target.value; renderBase(); const i = document.getElementById("q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
}

function renderSaved() {
  const items = PRODUCTS.filter(p => saved.has(p.id));
  document.getElementById("s-saved").innerHTML = `
    <div class="head"><div class="txt"><h1>Избранное</h1><p>Товары, к которым хотите вернуться</p></div></div>
    ${items.length ? listHTML(items) : `<div class="empty"><b>Пока пусто</b>Откройте товар и нажмите звёздочку в углу фото — он появится здесь.</div>`}`;
}

function renderAbout() {
  const pdfs = PRODUCTS.filter(p => p.pdf).length;
  document.getElementById("s-about").innerHTML = `
    <div class="about">
      <div class="logo"><img src="${AVATAR}" alt=""></div>
      <h1>Artur product</h1>
      <p>Открытая база товаров, которые только начинают расти за рубежом. У каждого — доказательства спроса, модель запуска, бюджет теста и честный вердикт.</p>
      <div class="kv">
        <div><span>Товаров в базе</span><b>${PRODUCTS.length}</b></div>
        <div><span>Полных разборов в PDF</span><b>${pdfs}</b></div>
        <div><span>Обновляется</span><b>с каждой находкой</b></div>
      </div>
      <div class="links">
        <a class="lnk" href="${CHANNEL_URL}" data-ext="1"><div class="ic">${ICONS.tg}</div>Канал в Telegram<span class="chev">${ICONS.chev}</span></a>
        <a class="lnk" href="${CONTACT_URL}" data-ext="1"><div class="ic">${ICONS.send}</div>Написать Артуру<span class="chev">${ICONS.chev}</span></a>
      </div>
      <div class="blk" style="margin-top:22px"><h4>Как читать карточку</h4>
        <p>Цифры спроса — из сервисов аналитики Amazon и TikTok Shop, скрины лежат в посте. Бюджет теста — минимальная сумма, с которой имеет смысл пробовать. Вердикт — личное мнение автора, не рекомендация к покупке.</p></div>
    </div>`;
}

function renderTabs() {
  const T = [["home","Главная","home"],["base","База","base"],["saved","Избранное","star"],["about","О базе","info"]];
  document.getElementById("tabs").innerHTML = T.map(([id,l,ic]) => `<button class="tab ${tab===id?"on":""}" data-tab="${id}">${ICONS[ic]}${l}</button>`).join("");
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === "s-" + tab));
}
function renderAll() { renderHome(); renderBase(); renderSaved(); renderAbout(); renderTabs(); }

/* ---------- detail ---------- */
function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  const k = verdictKind(p.verdict);
  const hero = p.photo ? `<img src="${p.photo}" alt="">` : esc(initials(p.name));
  document.getElementById("panel").innerHTML = `
    <div class="grab"></div>
    <div class="hero">${hero}
      <button class="star ${saved.has(p.id)?"on":""}" data-star="${p.id}" aria-label="В избранное">${ICONS.star}</button>
      <button class="close" data-close="1" aria-label="Закрыть">${ICONS.x}</button></div>
    <div class="pb">
      <h2>${esc(p.name)}</h2>
      <div class="tags">${[p.category, p.country, p.source, "Найдено " + fmtDate(p.date)].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="verdict"><i class="dot ${k}"></i><span>${esc(p.verdict)}</span></div>
      <div class="blk"><h4>Доказательства спроса</h4><p class="big">${esc(p.demand)}</p></div>
      <div class="blk"><h4>Почему заметил</h4><p>${esc(p.why)}</p></div>
      <div class="blk"><h4>Возможность для СНГ</h4><p>${esc(p.opportunity)}</p></div>
      <div class="facts">
        <div class="fact"><span>Модель запуска</span><b>${esc(p.model)}</b></div>
        <div class="fact"><span>Бюджет теста</span><b>${esc(p.budget)}</b></div>
        <div class="fact"><span>Сложность</span><b>${esc(p.complexity)}</b></div>
        <div class="fact"><span>Формат разбора</span><b>${esc(p.format)}</b></div>
      </div>
      <div class="risk"><h4>Главный риск</h4><p>${esc(p.risk)}</p></div>
      <div class="acts">
        ${p.post ? `<a class="act primary" href="${p.post}" data-ext="1">${ICONS.tg}Пост со скринами в канале</a>` : ""}
        ${p.pdf ? `<a class="act" href="${p.pdf}" data-ext="1">${ICONS.doc}Полный разбор в PDF</a>` : ""}
        ${p.sourceUrl ? `<a class="act" href="${p.sourceUrl}" data-ext="1">${ICONS.link}Источник</a>` : ""}
        <a class="act ghost" href="${CONTACT_URL}" data-ext="1">${ICONS.send}Обсудить этот товар с Артуром</a>
      </div>
    </div>`;
  const sh = document.getElementById("sheet");
  sh.classList.add("open"); sh.setAttribute("aria-hidden","false");
  document.getElementById("panel").scrollTop = 0;
  if (tg) { try { tg.BackButton.show(); tg.BackButton.onClick(closeProduct); } catch(e){} }
}
function closeProduct() {
  const sh = document.getElementById("sheet");
  sh.classList.remove("open"); sh.setAttribute("aria-hidden","true");
  if (tg) { try { tg.BackButton.hide(); tg.BackButton.offClick(closeProduct); } catch(e){} }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-open],[data-quick],[data-cat],[data-clear],[data-star],[data-close],[data-ext]");
  if (!t) { if (e.target.id === "sheet") closeProduct(); return; }
  if (t.dataset.ext) { e.preventDefault(); const u = t.getAttribute("href"); if (tg && /t\.me\//.test(u)) tg.openTelegramLink(u); else if (tg) tg.openLink(u); else window.open(u, "_blank"); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; renderTabs(); window.scrollTo(0,0); return; }
  if (t.dataset.quick) { filter = t.dataset.quick; category = "Все"; query = ""; tab = "base"; renderBase(); renderTabs(); window.scrollTo(0,0); return; }
  if (t.dataset.cat) { category = t.dataset.cat; renderBase(); return; }
  if (t.dataset.clear) { filter = null; renderBase(); return; }
  if (t.dataset.open) { openProduct(t.dataset.open); return; }
  if (t.dataset.close) { closeProduct(); return; }
  if (t.dataset.star) { const id = t.dataset.star; saved.has(id) ? saved.delete(id) : saved.add(id); t.classList.toggle("on"); persistSaved(); renderSaved(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeProduct(); });

/* ---------- optional: live data from Google Sheets (CSV) ---------- */
function parseCSV(text) {
  const rows = [], re = /("([^"]|"")*"|[^,\n\r]*)(,|\r?\n|$)/g; let row = [], m;
  while ((m = re.exec(text)) && m[0] !== "") { let v = m[1]; if (v.startsWith('"')) v = v.slice(1,-1).replace(/""/g,'"'); row.push(v); if (m[3] !== ",") { rows.push(row); row = []; } if (m.index + m[0].length >= text.length) break; }
  return rows;
}
function fromSheet(rows) {
  const h = rows[0], idx = n => h.findIndex(x => x.trim().toLowerCase().startsWith(n));
  const c = { id:idx("id"), photo:idx("фото"), date:idx("дата"), name:idx("продукт"), category:idx("категория"), country:idx("страна"), source:idx("площадка"), why:idx("почему"), demand:idx("доказательства"), opportunity:idx("возможность"), model:idx("модель"), budget:idx("бюджет"), complexity:idx("сложность"), risk:idx("главный риск"), verdict:idx("вердикт"), sourceUrl:idx("ссылка на источник"), post:idx("ссылка на пост"), pdf:idx("полный разбор"), format:idx("формат"), metric:idx("цифра") };
  const g = (r,k) => c[k] >= 0 ? (r[c[k]]||"").trim() : "";
  return rows.slice(1).filter(r => g(r,"id")).map(r => ({ id:g(r,"id"), photo:g(r,"photo"), date:g(r,"date"), name:g(r,"name"), category:g(r,"category"), country:g(r,"country"), source:g(r,"source"), why:g(r,"why"), demand:g(r,"demand"), opportunity:g(r,"opportunity"), model:g(r,"model"), budget:g(r,"budget"), complexity:g(r,"complexity"), risk:g(r,"risk"), verdict:g(r,"verdict"), sourceUrl:g(r,"sourceUrl").split(/\s/)[0], post:g(r,"post"), pdf:/^https?:/.test(g(r,"pdf")) ? g(r,"pdf") : "", format:g(r,"format"), metric:g(r,"metric") || g(r,"demand").split(/[;.]/)[0] }));
}
if (SHEET_CSV_URL) {
  fetch(SHEET_CSV_URL).then(r => r.text()).then(t => { const rows = fromSheet(parseCSV(t)); if (rows.length) { PRODUCTS = rows; renderAll(); } }).catch(() => {});
}

/* ---------- splash: минимум 1,8 с, затем плавно уходит ---------- */
const SPLASH_MIN = 3800, t0 = Date.now();
let splashDone = false;
function hideSplash() {
  if (splashDone) return; splashDone = true;
  const s = document.getElementById("splash"); if (!s) return;
  const wait = Math.max(0, SPLASH_MIN - (Date.now() - t0));
  setTimeout(() => {
    s.classList.add("hide");
    if (tg) { try { tg.setHeaderColor("#111214"); } catch(e){} }
    setTimeout(() => s.remove(), 500);
  }, wait);
}
window.addEventListener("load", hideSplash);
setTimeout(hideSplash, 4000);

renderAll();
</script>
