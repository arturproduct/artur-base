/* ---------- светлая тема (по умолчанию) ---------- */
:root{
  --bg:#f4f2ee; --outer:#e6e3dc; --surface:#ffffff; --surface-2:#ebe8e2; --line:rgba(20,20,20,.08);
  --text:#141414; --muted:#6b6e78; --dim:#9a9da6;
  --accent:#f0482c; --on-accent:#141414; --accent-soft:rgba(240,72,44,.12);
  --go:#1fa864; --check:#d99a1e; --wait:#8f93a0;
  --tabbar:rgba(244,242,238,.88); --overlay:rgba(20,20,20,.35); --shadow:0 1px 2px rgba(20,20,20,.04);
  --r-lg:22px; --r:14px; --r-sm:10px; --tab-h:66px;
}
/* ---------- тёмная тема ---------- */
:root[data-theme="dark"]{
  --bg:#111214; --outer:#0a0a0b; --surface:#1a1b1f; --surface-2:#232529; --line:rgba(255,255,255,.08);
  --text:#ffffff; --muted:#96989f; --dim:#6b6e78;
  --accent:#f0482c; --on-accent:#141414; --accent-soft:rgba(240,72,44,.14);
  --go:#3dd68c; --check:#f5b942; --wait:#8f93a0;
  --tabbar:rgba(17,18,20,.86); --overlay:rgba(0,0,0,.55); --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:700px){body{background:var(--outer)}#app{min-height:100vh;box-shadow:0 0 0 1px var(--line);background:var(--bg)}}

#view{padding:calc(14px + env(safe-area-inset-top)) 18px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.active{display:block}

.head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.head .txt{flex:1;min-width:0}
.head h1{font-size:23px;font-weight:900;line-height:1.15;margin:0 0 4px;letter-spacing:-.2px}
.head p{margin:0;color:var(--muted);font-size:12.5px;font-weight:500}
.ava{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--surface-2)}
.ava img{width:100%;height:100%;object-fit:cover}

.focus{background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:26px;position:relative;overflow:hidden}
.focus .eyebrow{font-size:12px;font-weight:700;opacity:.75;margin-bottom:8px}
.focus h2{font-size:19px;font-weight:900;line-height:1.2;margin:0 0 12px;letter-spacing:-.2px}
.focus .steps{display:flex;gap:6px;margin-bottom:8px}
.focus .steps i{flex:1;height:6px;border-radius:3px;background:rgba(20,20,20,.22)}
.focus .steps i.done{background:#141414}
.focus .stepnames{display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:.8;margin-bottom:14px}
.focus p{margin:0 0 16px;font-size:13px;font-weight:500;line-height:1.45;opacity:.92}
.focus .btn{background:#141414;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.focus .btn svg{width:16px;height:16px}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.sec h3{font-size:15px;font-weight:700;margin:0}
.sec button,.sec a{font-size:12.5px;font-weight:600;color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:96px;box-shadow:var(--shadow)}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.tile span{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:3px}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .ph{width:66px;height:66px;border-radius:12px;overflow:hidden;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--dim)}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .bd{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14px;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{font-size:12.5px;font-weight:600;margin-bottom:5px}
.row .vd{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
.dot.go{background:var(--go)}.dot.check{background:var(--check)}
.row .chev{color:var(--dim);flex:none}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-weight:500;font-size:14px;outline:none;min-width:0}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.chip.on{background:var(--text);color:var(--bg)}
.chip.x{background:var(--accent-soft);color:var(--accent)}
.count{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:6px}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:500;font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

/* бренды — журнальные карточки, не список */
.brand{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.brand .cv{aspect-ratio:3/2;background:var(--surface-2);position:relative}
.brand .cv img{width:100%;height:100%;object-fit:cover}
.brand .cv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 100%)}
.brand .cv .kind{position:absolute;left:12px;top:12px;z-index:1;background:#fff;color:#141414;font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 9px}
.brand .cv .nm{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff;font-weight:900;font-size:19px;line-height:1.15;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.brand .bd{padding:12px 14px 14px}
.brand .idea{font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:10px}
.brand .mx{display:flex;gap:8px;margin-bottom:10px}
.brand .mx div{flex:1;background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.brand .mx b{display:block;font-size:14px;font-weight:900;line-height:1.1;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .mx span{display:block;color:var(--muted);font-size:10.5px;font-weight:600;margin-top:3px;line-height:1.25}
.brand .m{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px;font-weight:600}
.brand .m .chev{margin-left:auto}
.feat{display:block;width:100%;text-align:left;border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:16/10;background:var(--surface-2);margin-bottom:26px}
.feat img{width:100%;height:100%;object-fit:cover}
.feat::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.78) 100%)}
.feat .kind{position:absolute;left:12px;top:12px;z-index:1;background:#fff;color:#141414;font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 9px}
.feat .tx{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff}
.feat .tx b{display:block;font-weight:900;font-size:18px;line-height:1.15;letter-spacing:-.2px;margin-bottom:4px}
.feat .tx span{display:block;font-size:12px;font-weight:600;opacity:.85}

/* читалка разбора бренда */
.rd .cv{position:relative;aspect-ratio:3/2;background:var(--surface-2);margin:12px 18px 0;border-radius:18px;overflow:hidden}
.rd .cv img{width:100%;height:100%;object-fit:cover}
.rd .cv .close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,18,20,.7);display:flex;align-items:center;justify-content:center}
.rd .cv .close svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.rd .cv .kind{position:absolute;left:10px;top:10px;background:#fff;color:#141414;font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 9px}
.rd .pb h2{font-size:21px;margin-bottom:6px}
.rd .date{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:14px}
.rd .idea{background:var(--text);color:var(--bg);border-radius:var(--r);padding:13px 14px;font-weight:700;font-size:14px;line-height:1.35;margin-bottom:14px}
.rd .mx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.rd .mx div{background:var(--surface);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow);min-width:0}
.rd .mx b{display:block;font-size:16px;font-weight:900;color:var(--accent);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd .mx span{display:block;color:var(--muted);font-size:10.5px;font-weight:600;margin-top:4px;line-height:1.25}
.rd .body p{margin:0 0 12px;font-size:14px;font-weight:500;line-height:1.55}
.rd .body p strong{font-weight:700}
.rd .body h3{font-size:14px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.rd .body h3::before{content:'';width:16px;height:4px;border-radius:2px;background:var(--accent)}
.rd .body a{color:var(--accent);font-weight:600;border-bottom:1px solid var(--accent-soft)}
.rd .body img{display:block;width:100%;border-radius:12px;margin:4px 0 14px}
.rd .body table{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.rd .body th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line)}
.rd .body td{padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600}
.rd .body tr:last-child td{border-bottom:0}
.rd .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:18px 0 20px}
.rd .take h4{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.rd .take p{margin:0;font-size:14px;font-weight:600;line-height:1.5}
.rd .lnks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.rd .lnks a{background:var(--surface);border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.rd .lnks a svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rd .vh{font-size:14px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.rd .vh::before{content:'';width:16px;height:4px;border-radius:2px;background:var(--accent)}
.rd .vid{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.rd .vbox{position:relative;aspect-ratio:9/16;background:#111}
.rd .vbox video{width:100%;height:100%;object-fit:cover;display:block}
.rd .vbox .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--accent);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rd .vbox .play i{display:block;width:0;height:0;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:5px}
.rd .vbox.playing .play{display:none}
.rd .vbox .snd{position:absolute;left:10px;bottom:10px;background:rgba(17,18,20,.75);color:#fff;border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;display:none}
.rd .vbox.playing .snd{display:block}
.rd .vid .cap{padding:10px 12px 12px;font-size:12.5px;font-weight:600;line-height:1.4}
.rd .vid .cap a{color:var(--accent);border-bottom:1px solid var(--accent-soft)}
.rd .vids{margin:2px 0 20px}
.rd .rel{margin-bottom:18px}
.rd .rel h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.rd .rel .row{background:var(--surface);border-radius:var(--r);padding:10px 12px;border:0;box-shadow:var(--shadow)}

/* о базе */
.about .logo{width:84px;height:84px;border-radius:22px;overflow:hidden;margin:6px 0 16px}
.about .logo img{width:100%;height:100%;object-fit:cover}
.about h1{font-size:22px;font-weight:900;margin:0 0 8px}
.about p{color:var(--muted);font-weight:500;margin:0 0 18px;font-size:13.5px}
.kv{border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:500}
.kv div span:first-child{color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.lnk{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:13px 14px;font-weight:600;font-size:13.5px;text-align:left;width:100%;box-shadow:var(--shadow)}
.lnk .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.lnk .ic svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnk .chev{margin-left:auto;color:var(--dim)}
.setting{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:13px 14px;margin-top:8px;box-shadow:var(--shadow)}
.setting .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.setting .ic svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setting b{display:block;font-size:13.5px;font-weight:600}
.setting span{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:2px}
.switch{margin-left:auto;width:48px;height:28px;border-radius:14px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar .in{pointer-events:auto;width:100%;max-width:430px;background:var(--tabbar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--dim);font-size:10px;font-weight:700;border-radius:12px;white-space:nowrap}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab:focus-visible,.tile:focus-visible,.row:focus-visible,.lnk:focus-visible,.chip:focus-visible,.rev:focus-visible,.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* карточка товара */
.sheet{position:fixed;inset:0;z-index:30;display:none;justify-content:center;align-items:flex-end;background:var(--overlay)}
.sheet.open{display:flex}
.panel{width:100%;max-width:430px;max-height:100%;background:var(--bg);border-radius:22px 22px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--surface-2);margin:10px auto 0}
.hero{position:relative;margin:12px 18px 0;border-radius:18px;overflow:hidden;background:var(--surface);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:var(--dim)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,18,20,.7);display:flex;align-items:center;justify-content:center;color:#fff}
.hero .close svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .star{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,18,20,.7);display:flex;align-items:center;justify-content:center}
.hero .star svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round}
.hero .star.on svg{fill:var(--accent);stroke:var(--accent)}
.pb{padding:16px 18px calc(24px + env(safe-area-inset-bottom))}
.pb h2{font-size:20px;font-weight:900;line-height:1.2;margin:0 0 10px;letter-spacing:-.2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow)}
.verdict{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-weight:600;font-size:13px;line-height:1.4;box-shadow:var(--shadow)}
.verdict .dot{margin-top:6px}
.blk{margin-bottom:16px}
.blk h4{margin:0 0 5px;font-size:12px;font-weight:700;color:var(--muted)}
.blk p{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.blk .big{font-size:14px;font-weight:600;line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fact{background:var(--surface);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.fact span{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-bottom:3px}
.fact b{font-size:13px;font-weight:700;line-height:1.3}
.risk{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:20px}
.risk h4{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.risk p{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:13px 16px;font-weight:700;font-size:13.5px;background:var(--surface);box-shadow:var(--shadow)}
.act.primary{background:var(--accent);color:var(--on-accent)}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.ghost{background:none;color:var(--muted);padding:8px;box-shadow:none}
.act.todo{background:none;box-shadow:none;border:1.5px dashed var(--muted);color:var(--muted);font-weight:600;opacity:.8}

@media (prefers-reduced-motion:reduce){.panel{transition:none}.switch,.switch::after{transition:none}}

/* заставка */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 42%,#f35434 0%,#e43a21 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .mark{width:min(64vw,260px);animation:mark .7s cubic-bezier(.2,.8,.2,1) both}
#splash .mark img{width:100%;display:block}
#splash .sub{margin-top:6px;font-weight:700;font-size:13px;color:#141414;opacity:0;animation:fade .6s .35s forwards}
#splash .bar{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom));width:120px;height:3px;border-radius:2px;background:rgba(20,20,20,.16);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:#141414;border-radius:2px;transform-origin:left;animation:load 3.4s .25s cubic-bezier(.4,0,.2,1) both}
@keyframes mark{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:.8}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash .mark,#splash .bar i{animation:none}#splash .sub{animation:none;opacity:.8}}
</style>
</head>

о по Kinect. Nex сделал его удобным для семьи: простое подключение, игры с известными персонажами и регулярные обновления. Продажа приставки открывает бренду возможность получать повторную выручку от доступа к играм.</p>\n\n<h3>Сайт: 8,8 млн посещений за два года</h3>\n<p>По Semrush за август 2024 — июль 2026: 8,8 млн посещений и 5,6 млн уникальных пользователей. В декабре 2025 года — больше 2 млн посещений за месяц. Масштаб трафика и этот пик показывают, какой интерес продукт вызывает у аудитории.</p>\n<p>Крупнейший канал — Direct, следом органический поиск и переходы с других сайтов. Для меня это повод изучать, где люди впервые узнают бренд и почему возвращаются. Direct сам по себе не означает, что бренд получает клиентов бесплатно: короткое видео может познакомить с продуктом, а покупатель потом зайдёт на сайт напрямую.</p>\n<p>85% посещений приходится на США — 7,5 млн за два года. Дальше идут Великобритания, Канада и Австралия.</p>\n\n<h3>Продажи на площадках</h3>\n<p><strong>Amazon</strong> (Helium 10): $1,70 млн и 6 270 консолей за 30 дней на одной карточке. У карточки 5 230 отзывов и рейтинг 4,7. Люди не просто смотрят ролики — они покупают этот продукт и пользуются им.</p>\n<p><strong>TikTok Shop</strong> (Kalodata, 12.08–10.09.2026): ещё $359,8 тыс. и около 1 520 устройств. 67% выручки приходится на видео, ещё 32% — на эфиры.</p>\n<p><strong>Walmart</strong>: больше 4 тыс. оценок, рейтинг 4,4. Точных продаж я не вижу, поэтому в общий расчёт закладываю ещё $500 тыс. в месяц как свою оценку.</p>\n<table>\n<tr><th>Площадка</th><th>Оборот за 30 дней</th></tr>\n<tr><td>Amazon / Helium 10</td><td>$1 700 647</td></tr>\n<tr><td>TikTok Shop / Kalodata</td><td>$359 800</td></tr>\n<tr><td>Walmart / моя оценка</td><td>$500 000</td></tr>\n<tr><td><strong>Итого с оценкой Walmart</strong></td><td><strong>$2 560 447</strong></td></tr>\n</table>\n<p>И это только три площадки, которые мы посмотрели. Продажи на собственном сайте Nex, в других магазинах и рознице здесь не учтены. Деньги от подписки Play Pass тоже не входят в эту сумму — пока посчитаны только сами приставки.</p>\n\n<h3>Почему такая консоль может заинтересовать родителей в России</h3>\n<p>Россияне уже покупают игровые приставки — это видно по объёму рынка: <strong>1,48 млн консолей за 2025 год</strong> и 795 тыс. за первое полугодие 2026-го (М.Видео / ICMR). Здесь я бы делал акцент на том, что ребёнок продолжает играть перед телевизором, но при этом прыгает, танцует и двигается всем телом. Родителям легко объяснить, зачем им такой продукт.</p>\n<p>Какой объём я рассматривал: отталкивался от среднего и премиального сегмента — около 600 тыс. устройств в год. Дальше проверял, что означают небольшие доли этого объёма.</p>\n<table>\n<tr><th>Условная доля</th><th>Продажи за год</th></tr>\n<tr><td>0,5%</td><td>≈ 3 000</td></tr>\n<tr><td>1%</td><td>≈ 6 000</td></tr>\n<tr><td>2%</td><td>≈ 12 000</td></tr>\n</table>\n<p>Для ориентира: 1% этого сегмента — 6 000 консолей в год, или в среднем 500 в месяц. С этим масштабом можно сопоставить условия, которые предложит завод. Это сценарии, не прогноз.</p>\n\n<h3>На 1688 я нашёл завод с похожей консолью</h3>\n<p>Я сильно сомневаюсь, что мы просто напишем Nex и получим право продавать их консоль в России. Меня интересует сама бизнес-модель: можно ли создать похожий продукт под своим брендом для нашего рынка? Поэтому я нашёл завод на 1688 и связался с ним напрямую.</p>\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIcAtADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwECBAUGAAcI/8QASRAAAQMDAgMGBAMGBQIFBAAHAQIDEQAEIRIxBUFRBhMiYXGBFDKRoUKxwQcVI1Ji0TNyguHwJEMWU5KisiU0Y/GDkwg1RHTC/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACoRAQEAAgICAgEEAgIDAQAAAAABAhEDIRIxBEFRBRMiMmFxFEIzUoGR/9oADAMBAAIRAxEAPwCIUveVDWh0jkPauLi+pppUvqa8bqQsvRM59Kb8M8adrXEkmkJUT801FMNo и и сколько остаётся на каждой продаже.</p>\n\n<h3>Самое интересное — эксклюзив на Россию</h3>\n<p>За пять лет я много раз просил заводы об эксклюзиве. Практически всегда они отказывали: если товар уже покупают несколько клиентов, зачем ограничивать себя одним? А здесь завод ещё не развивал российский рынок и уже в первом разговоре согласился обсуждать эксклюзив — при условии <strong>5 000 единиц в месяц</strong> в первые три месяца.</p>\n<p>Для старта это слишком большой объём. Но переговоры только начались: я бы обсуждал тестовую партию, более длительный срок и постепенное увеличение закупок. Если закрепим эксклюзив в договоре, сможем ограничить поставки этой модели другим продавцам в России. Тогда я смогу вкладываться в локализацию и развитие собственного бренда, не опасаясь, что завтра клиент того же завода выйдет с идентичным товаром.</p>\n\n<h3>Мой первый шаг</h3>\n<p>Оригинал и китайский образец я поставил бы рядом и сравнил: корпус и камеру, распознавание движений, игры и программу, удобство для ребёнка.</p>\n<p>Если китайская версия сильно хуже — от проекта нужно отказываться. Если сопоставима — тогда уже проверять полную экономику и реальный спрос в России.</p>\n\n<h3>Вердикт: тестировал бы сейчас</h3>\n<p>Продажи оригинала дают повод изучать модель. Переписка с заводом даёт конкретную точку входа. Теперь мне нужен образец, который подтвердит качество — уже после этого я бы принимал решение о запуске собственного бренда.</p>\n<p><strong>Для меня ценность такого разбора в том, чтобы пройти от интересного продукта до реального разговора с производством.</strong></p>\n\n<h3>На чём основан разбор</h3>\n<p>Скриншоты от 12.09.2026: Semrush, Helium 10 / Amazon, Kalodata / TikTok Shop и Walmart. Моя переписка с заводом и живые фотографии китайской консоли. Оборот Walmart в расчёте — моя оценка. Данные рынка России — М.Видео / ICMR.</p>\n", "takeaway": "Продукт как вход в экосистему: консоль продаётся один раз, а подписка с играми и персонажами — каждый месяц.", "l кладные волосы нужны тем, кто хочет добавить длину или объём. А пригладить волосы и быстро поправить укладку — задача гораздо более широкой аудитории. Человек мог вообще не искать накладные пряди, но увидел необычную щётку, заинтересовался и получил повод познакомиться с Hair Choice.</p>\n<p>При этом продукт остаётся в теме бренда: помогает сделать аккуратную причёску и дополняет основной ассортимент.</p>\n<p>И показывать его удобно. Крупный план щётки, гель на щетине, несколько движений по волосам — сразу понятно, как пользоваться. Блогер вообще демонстрирует его в машине. Смотришь и понимаешь, зачем такая вещь может понадобиться тебе.</p>\n<p><strong>Получается, продукт выполняет сразу две задачи: продаётся сам и привлекает внимание к остальному ассортименту бренда.</strong></p>\n\n<h3>Что с этого российским брендам</h3>\n<p>Я думаю, российским косметическим брендам стоит присмотреться к такой идее. Особенно тем, кто уже выпускает средства для волос: разработать свою версию такого продукта несложно, а работать он будет на весь ассортимент.</p>\n<p><strong>Какой продукт в вашей линейке мог бы стать такой щёткой?</strong></p>", "takeaway": "Сделать продукт для широкой аудитории, который остаётся в теме бренда, — и показывать его за три секунды.", "links": [{"t": "Ролик блогера в Instagram", "u": "https://www.instagram.com/reels/DaQjA7tNWVS/"}, {"t": "Ролик бренда в Instagram", "u": "https://www.instagram.com/reels/DW3_rWoAS4k/"}], "productId": "", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAHgAtADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QARRAAAQQBAwIFAgMFBQYEBgMAAQACAxEEBRIhBjETIkFRYRRxBzKBI0JSkaEVU2Kx0RYkM3KSwUOC4fAXJTREVPE1g6L/xAAbAQADAQEBAQEAAAAAAAAAAAAAAQIDBAUGB//EACURAQADAAICAgIDAQEBAAAAAAABAhEDEgQhEzEFQSIyURQjYf/aAAwDAQACEQMRAD8A90pFJULtmXLhKRS o8+sUUkn//Z", "cap": "Ролик бренда — 1,6 млн просмотров: «Have you ever seen something like this?»", "url": "https://www.instagram.com/reels/DW3_rWoAS4k/", "auto": false}], "post": "https://t.me/arturproduct1/319", "url": "https://arturproduct.github.io/artur-base/edgelock.html", "urlLabel": "Полный разбор на странице"}, {"id": "R003", "date": "2026-09-21", "name": "Пушистиксы и Fluppy", "title": "Создай своего питомца и носи его с собой. Два российских бренда, в которых я увидел потенциал целой категории", "idea": "Создай своего персонажа своими руками — и носи его с собой", "metrics": [{"v": "748 тыс.", "l": "просмотров у ролика «Пушистиксов»"}, {"v": "48 тыс.", "l": "лайков у ролика Fluppy"}, {"v": "≈ 1 500 ₽", "l": "набор: занятие и питомец"}], "body": "<h3>Что за проекты</h3>\n<p>Нашёл два российских проекта — <a href=\"https://pushistix.ru/\">«Пушистиксы»</a> и <a href=\"https://fluppy-flowers.ru/\">Fluppy</a>. Оба развивают тему миниатюрных пушистых питомцев и продают наборы, из которых можно сделать своего маленького друга своими руками.</p>\n<p><a href=\"https://www.instagram.com/anaa.stacie/\">Instagram «Пушистиксов»</a> · <a href=\"https://www.instagram.com/fluppy_flowers/\">Instagram Fluppy</a></p>\n<p>У каждого свой блог, своя подача и свои персонажи. И оба сейчас сообщают о большом количестве заказов и временно приостанавливают продажи наборов.</p>\n<p><strong>У «Пушистиксов» стандартный набор стоит 1 590 ₽.</strong> Внутри материалы для пуделя, мальтипу или бишона, глазки, носик, ошейник, маленькая щётка, клей, паспорт питомца и видеоинструкция. Есть двойной Besty за 2 190 ₽ — на двух питомцев, с карабинами для брелков. Можно вместе с подругой сделать каждому своего)</p>\n<p>Основательница интересно развивает контент: создаёт миниатюры питомцев известных людей. На сайте есть <a href=\"https://pushistix.ru/collection\">коллекция «9 из 100»</a>, с именами и отдельными коробками. В комментариях просят следующих животных. Получается история, за продолжением которой можно следить.</p>\n<p>В её Instagram есть ролики на <strong>534, 695 и 748 тысяч просмотров</strong>. А в Telegram она <a href=\"https://t.me/anaastacie/3347\">рассказывает</a>, что продажи пришлось временно закрыть, чтобы разобраться с текущей партией заказов.</p>\n<p><strong>У Fluppy базовый набор «Мальтипу» стоит 1 480 ₽</strong>, с дополнительными инструментами — 2 180 ₽. Можно выбрать цвет, а фурнитура для брелка уже входит в комплект. На сайте также анонсирован шпиц.</p>\n<p>Мне понравилось, как они заходят через понятную ситуацию: <a href=\"https://www.instagram.com/reel/DdZLIiJI9uS/\">что подарить человеку, у которого уже всё есть?</a> Сделать маленького пушистого друга, а если есть свой питомец — попробовать собрать его мини-версию. У этого ролика на момент разбора <strong>больше 48 тысяч лайков</strong>. В комментариях спрашивают цену, как заказать, будут ли кошки и другие породы.</p>\n<p>Причём Fluppy уже пробовал коллекционный формат: <a href=\"https://t.me/fluppy_flowers/43\">сюрприз-боксы</a>, где внутри один случайный персонаж из семи основных и двух секретных. Это отдельное предложение, помимо набора для творчества. А сейчас команда <a href=\"https://www.instagram.com/fluppy_flowers/reel/Ddf6IsroCVe/\">ищет мастериц</a>: по их словам, заказов пришло больше, чем они могут обработать своими силами.</p>\n<p>Для меня два таких проекта — повод внимательнее посмотреть на саму категорию. Видно и внимание к контенту, и сообщения о заказах. Какой у каждого объём продаж, мы не знаем, но интерес к формату уже есть.</p>\n<h3>Почему это работает</h3>\n<p><strong>Весь прикол — в сочетании самого процесса и того, что остаётся у тебя после.</strong></p>\n<p>Ты проводишь время за созданием питомца: собираешь, расчёсываешь, придаёшь ему характер. И ценность для тебя уже другая — ты сделал его сам.</p>\n<p>А потом крепишь на сумку или рюкзак и носишь с собой. По этому сценарию мне сразу вспомнились Labubu. Только здесь добавляется личная история создания твоей игрушки. Её хочется показать и сказать: «Смотри, я сам сделал».</p>\n<p>Это же помогает с контентом. Можно показать весь путь: открываешь коробку, достаёшь материалы, собираешь, расчёсываешь — и вот у тебя в руках маленький питомец. Покупатель тоже может снять свой результат, показать друзьям и отметить бренд.</p>\n<p>И важный момент: сама идея делать фигурки из пушистой проволоки давно существует. За рубежом уже есть <a href=\"https://fuzzypipe.com/blogs/pipe-cleaner-crafts/12-diy-keychain-charm-ideas-made-with-pipe-cleaners\">похожие наборы и уроки</a>. Здесь мне интереснее то, как вокруг знакомого творчества собирают бренд.</p>\n<p>У «Пушистиксов» — паспорт питомца, имена и коллекция известных животных. У Fluppy — свои «флаппики», подарочная подача и сюрприз-боксы. Знакомая техника получает свой стиль, историю и поводы для следующей покупки.</p>\n<h3>Где расти</h3>\n<p><strong>И вот здесь я вижу много возможностей для роста.</strong></p>\n<p>Разные животные и персонажи. Базовая линейка, которую всегда можно купить, и отдельные коллекции к Новому году, 8 Марта, другим праздникам. Менять образы, цвета, аксессуары, упаковку. У человека появляется повод собрать следующего питомца или подарить такой набор близкому.</p>\n<p>Отдельные коллекции можно выпускать ограниченными партиями — с понятным тиражом и датой запуска. При этом нынешнюю остановку продаж оба проекта объясняют необходимостью выполнить уже полученные заказы. Это не стоит путать с заранее спланированным дефицитом.</p>\n<p><strong>Я бы развивал эту историю через качество продукта и организацию производства.</strong> Найти сильное производство в Китае, проработать материалы, фурнитуру и комплектацию. Чтобы ворс был приятным, крепление надёжным, коробка выглядела достойно, а по инструкции у обычного человека получалась такая же милая игрушка, как в ролике.</p>\n<p>Следующий шаг я вижу в том, чтобы выстроить регулярный выпуск наборов: держать запас популярных вариантов, заранее готовить праздничные коллекции, наладить комплектацию и отправку. Чтобы после удачного ролика бренд мог принять новые заказы и вовремя их выполнить. А у авторов оставалось время придумывать новых персонажей, снимать контент и развивать бренд.</p>\n<p>Для меня <strong>около 1 500 ₽ за занятие и питомца, которого потом носишь с собой, выглядит интересным предложением</strong>. По своему опыту закупок, думаю, что при работе с объёмом себестоимость такого набора можно сделать невысокой. Поэтому вижу здесь потенциал высокой маржи, особенно если выстроить производство и комплектацию.</p>\n<h3>Что бы делал я</h3>\n<p>И такой разбор — повод вдохновиться и придумать своё. Совсем не обязательно повторять эти проекты один в один. Я бы не заходил с такими же собачками и кошками. Мне интереснее взять саму механику: <strong>создай своего персонажа своими руками и носи его с собой.</strong></p>\n<p>А дальше придумать других героев: маленьких монстриков, фантастических существ, персонажей со своими именами и характерами. Разработать свой внешний вид, истории и коллекции. Так можно построить самостоятельный бренд, который люди будут узнавать по его собственным героям.</p>\n<p>Такой подход можно пробовать и в других направлениях: свечах, мыле, украшениях, наборах для творчества. Взять понятную механику, сделать качественный комплект, добавить свой стиль и историю. Доступные материалы могут дать хорошую экономику, а ценность для покупателя складывается из процесса, результата и отношения к своему творению.</p>\n<p>Очень нравится, как вокруг такой маленькой вещи можно выстроить целый мир. Обоим проектам — большого успеха. Я вижу здесь много пространства для развития 🤍</p>", "takeaway": "Взять механику, придумать своих героев с именами и историями, выстроить производство в Китае и регулярные коллекции — чтобы после удачного ролика бренд принимал заказы, а не закрывал продажи.", "links": [{"t": "Сайт «Пушистиксов»", "u": "https://pushistix.ru/"}, {"t": "Сайт Fluppy", "u": "https://fluppy-flowers.ru/"}, {"t": "Insta   const h = rows[0], idx = n => h.findIndex(x => x.trim().toLowerCase().startsWith(n));
  const c = { id:idx("id"), date:idx("дата"), name:idx("бренд"), title:idx("заголовок"), idea:idx("суть"), summary:idx("описание"), body:idx("текст"), takeaway:idx("вывод"), cover:idx("обложка"), links:idx("ссылки"), productId:idx("товар"), url:idx("полный"), post:idx("пост"), metrics:idx("цифры") };
  const g = (r,k) => c[k] >= 0 ? (r[c[k]]||"").trim() : "";
  const toDate = s => { const m = s.match(/(\d{2})\.(\d{2})\.(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : s.slice(0,10); };
  return rows.slice(1).filter(r => g(r,"id") && g(r,"name")).map(r => ({
    id:g(r,"id"), date:toDate(g(r,"date")), name:g(r,"name"), title:g(r,"title") || g(r,"name"), idea:g(r,"idea"), summary:g(r,"summary"), body:g(r,"body"), takeaway:g(r,"takeaway"), cover:g(r,"cover"),
    links:g(r,"links").split(/\n|;/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*[-—]\s*(https?:\S+)$/); return m ? {t:m[1], u:m[2]} : {t:x, u:x}; }),
    metrics:g(r,"metrics").split(/\n|;/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*[-—]\s*(.*)$/); return m ? {v:m[1], l:m[2]} : {v:x, l:""}; }),
    productId:g(r,"productId"), url:g(r,"url"), post:g(r,"post") }));
}
if (SHEET_CSV_URL) fetch(SHEET_CSV_URL).then(r => r.text()).then(t => { const rows = productsFromSheet(parseCSV(t)); if (rows.length) { PRODUCTS = rows; renderAll(); } }).catch(() => {});
if (BRANDS_CSV_URL) fetch(BRANDS_CSV_URL).then(r => r.text()).then(t => { const rows = brandsFromSheet(parseCSV(t)); if (rows.length) { BRANDS = rows; renderAll(); handleStart(); } }).catch(() => {});

/* ---------- заставка ---------- */
const SPLASH_MIN = 3800, t0 = Date.now();
let splashDone = false;
function hideSplash() {
  if (splashDone) return; splashDone = true;
  const s = document.getElementById("splash"); if (!s) return;
  const wait = Math.max(0, SPLASH_MIN - (Date.now() - t0));
  setTimeout(() => {
    s.classList.add("hide");
    setTimeout(() => { s.remove(); if (tg) { try { tg.setHeaderColor(THEME_COLORS[theme].header); tg.setBackgroundColor(THEME_COLORS[theme].bg); } catch(e){} } }, 500);
  }, wait);
}
window.addEventListener("load", hideSplash);
setTimeout(hideSplash, 4000);

renderAll();
attachTelegram();
handleStart();
</script>
